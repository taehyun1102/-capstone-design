
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capstone-backend
  template:
    metadata:
      labels:
        app: capstone-backend
    spec:
      containers:
        - name: backend
          image: capstone-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: capstone-backend-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
