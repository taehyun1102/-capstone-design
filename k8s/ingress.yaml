
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capstone-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: capstone-backend-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: capstone-frontend-service
                port:
                  number: 3000
