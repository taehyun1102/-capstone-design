
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capstone-frontend
  template:
    metadata:
      labels:
        app: capstone-frontend
    spec:
      containers:
        - name: frontend
          image: capstone-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
